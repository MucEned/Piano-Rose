<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piano Rose</title>
  <meta name="description" content="Học piano theo phương pháp Méthode Rose – hỗ trợ đàn MIDI, bàn phím máy tính và chế độ chơi tự do.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Music&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><span class="logo">🌹</span><span><b>Piano Rose</b><small>Méthode Rose</small></span></a>
    <nav class="nav">
      <a href="#/" data-nav="lessons">Bài học</a>
      <a href="#/free" data-nav="free">Chơi tự do</a>
      <a href="#/drill" data-nav="drill">Luyện đọc nốt</a>
    </nav>
    <div class="status-bar">
      <span id="sound-pill" class="pill" hidden></span>
      <span id="kbd-pill" class="pill"></span>
      <button id="midi-pill" class="pill status" title="Thiết bị MIDI – bấm để cài đặt"></button>
      <button id="settings-btn" class="icon-btn" title="Cài đặt" aria-label="Cài đặt">⚙</button>
    </div>
  </header>
  <main id="view"></main>

  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/freeplay.js"></script>
  <script src="js/drill.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
